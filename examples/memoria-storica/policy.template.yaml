# Annona — policy dell'esempio «Memoria storica». La scrive setup.sh:
# __PRATICHE__ diventa il percorso assoluto delle pratiche, __MODEL__ il modello locale,
# e resta un solo blocco di frontiera: VERTEX se c'è GCP_PROJECT, ANTHROPIC se c'è
# ANTHROPIC_API_KEY, nessuno altrimenti.
#
# Il caso: il CEO chiede una bozza di contratto per Nordika Mobility. Solo la
# memoria dell'azienda sa che Nordika è partner diretto di Veloce Automotive,
# cliente storico, e che l'NDA con Veloce impone di avvisarlo prima. La memoria è
# indicizzata e interrogata in locale; ciò che recupera sigilla il run.

version: 1
default: deny

classes:
  restricted:
    paths:
      - __PRATICHE__/Memoria-Storica/**
    patterns:
      - '[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]'          # codice fiscale
      - '\bIT\d{2}[A-Z]\d{10}[0-9A-Z]{12}\b'               # IBAN
  # Internal = resta in casa. Ci finisce ciò che sta nelle cartelle personali di
  # lavoro e qualunque testo che parli di offerte, contratti e prezzi: una
  # proposta commerciale non è «public» solo perché non sta in una cartella
  # riservata. Gli allegati si classificano per ciò che contengono.
  # La redazione toglie gli identificativi, non la posizione: un documento
  # classificato per dove sta resta di quella classe anche redatto.
  internal:
    paths:
      - __PRATICHE__/Commerciale/**
      - ~/Documents/**
      - ~/Downloads/**
    patterns:
      - '(?i)\b(offerta|preventivo|proposta commerciale|listino|quotazione|iva esclusa|\+\s?iva|contratto|condizioni economiche)\b'
      - '€\s?\d|\d\s?€|\bEUR\s?\d'
  # Public = una domanda senza allegati.
  public:
    default: true

substrates:
  - id: local-gpu
    kind: ollama
    endpoint: http://localhost:11434
    model: __MODEL__
    jurisdiction: on-prem
    max_class: restricted
    tools: true
    context_window: 32768
    cost_per_mtok: 0.0
    quality: 60
    probe: true
#VERTEX
  - id: frontier
    kind: vertex
    endpoint: https://__GCP_REGION__-aiplatform.googleapis.com/v1/projects/__GCP_PROJECT__/locations/__GCP_REGION__
    model: __FRONTIER_MODEL__
    jurisdiction: eu
    max_class: public
    quality: 90
    probe: true
#/VERTEX
#ANTHROPIC
  - id: frontier
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model: claude-opus-5
    jurisdiction: us
    max_class: public
    quality: 98
    probe: true
#/ANTHROPIC

rules:
  - id: R-memoria
    match: {class: restricted}
    allow: [local-gpu]
    on_unavailable: redact
  - id: R-interno
    match: {class: internal}
    allow: [local-gpu]
    on_unavailable: redact
  - id: R-pubblico
    match: {class: public}
    allow: [__PUBLIC__]
    prefer: quality

egress:
  redact:
    allowed_for: [internal, restricted]
  sealed:
    paths:
      - __PRATICHE__/Memoria-Storica/**
    patterns:
      - 'Veloce Automotive'
      - 'piattaforma Kappa'
      - 'VA-2019-07'

redaction:
  provider: rizzo-pii
  endpoint: http://127.0.0.1:5005
  on_error: hold
  floor: public

tools:
  allow:
    # la seconda cartella è dove l'interfaccia mette un file allegato (run.sh esporta ANNONA_INBOX).
    document_reader: [__PRATICHE__/**, __INBOX__/**]
    explorer: [__PRATICHE__/**]
    memory_search: [__PRATICHE__/**]

# La memoria storica dell'azienda: indicizzata in locale da bge-m3 su local-gpu,
# interrogata prima di ogni domanda. Un passaggio recuperato porta con sé il
# percorso del documento, e con quello la sua classe e il suo sigillo.
memory:
  folders:
    - __PRATICHE__/Memoria-Storica/**
    - __PRATICHE__/Commerciale/**
  embed_with: local-gpu
  model: bge-m3
  prefetch: true
  entities: true     # la mappa di chi è partner di chi, estratta da local-gpu
  company: Meccatronica Lariana S.r.l.
  top_k: 6

skills: [conflict-check]
